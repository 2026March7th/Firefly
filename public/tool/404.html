*{margin:0;padding:0;box-sizing:border-box}
html,body{min-height:100vh;width:100%;font-family:"Microsoft YaHei","PingFang SC",sans-serif;overflow:hidden}
body::before{content:'';position:fixed;inset:0;background:rgba(0,0,0,0.45);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);z-index:0}
.container{position:relative;z-index:1;background:rgba(255,255,255,0.12);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:24px;padding:60px 48px;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.25);max-width:480px;width:100%}
.code{font-size:96px;font-weight:800;background:linear-gradient(135deg,#ff6b6b,#ff9ff3,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;margin-bottom:8px;letter-spacing:-2px}
.title{font-size:26px;color:#fff;margin-bottom:12px;text-shadow:0 2px 8px rgba(0,0,0,0.5);font-weight:600}
.desc{font-size:15px;color:rgba(255,255,255,0.8);margin-bottom:36px;line-height:1.7;text-shadow:0 1px 4px rgba(0,0,0,0.3)}
.btn-group{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-block;padding:12px 32px;text-decoration:none;border-radius:30px;font-size:15px;font-weight:500;transition:all 0.3s ease;cursor:pointer;border:none}
.btn-retry{background:rgba(255,255,255,0.2);color:#fff;border:1px solid rgba(255,255,255,0.4)}
.btn-retry:hover{background:rgba(255,255,255,0.3);transform:translateY(-2px);box-shadow:0 4px 16px rgba(0,0,0,0.2)}
.btn-home{background:linear-gradient(135deg,#ff6b6b,#ff9ff3);color:#fff;box-shadow:0 4px 15px rgba(255,107,107,0.4)}
.btn-home:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(255,107,107,0.5)}
.btn:active{transform:translateY(0)}
</style>

<body>
<div class="container">
  <div class="code">404</div>
  <h1 class="title">404 - 页面未找到</h1>
  <p class="desc">您访问的页面不存在或已被移除<br>请检查网址是否正确，或返回主页继续浏览</p>
  <div class="btn-group">
    <button class="btn btn-retry" id="retryBtn">重试 (3)</button>
    <a class="btn btn-home" href="index.html">返回主页</a>
  </div>
</div>
<script>
console.log('HTTP/1.1 301 Moved Permanently');
console.log('Location: https://march7th.work/index.html');
var count=3;
var btn=document.getElementById('retryBtn');
var timer=setInterval(function(){
  count--;
  if(count<=0){
    clearInterval(timer);
    btn.textContent='正在跳转...';
    btn.disabled=true;
    location.href='index.html';
  }else{
    btn.textContent='重试 ('+count+')';
  }
},1000);
btn.onclick=function(){
  clearInterval(timer);
  location.href='index.html';
};
</script>
