  <h1 class="tool-title" data-i18n="bt.title">北京时间</h1>
  <p class="tool-subtitle" data-i18n="bt.subtitle">东八区标准时间，精确到毫秒</p>
  <p class="tool-intro">本工具提供在线北京时间显示，基于东八区中国标准时间，精确到毫秒。打开网页即可看到当前日期、星期、时区以及实时走动的北京时间，支持实时与服务器时间同步，并可一键进入全屏模式，适合需要精准对时的场景。</p>

  <div class="date-info">
    <div class="date-line" id="dateLine" data-i18n="common.loading">加载中...</div>
    <div class="week-line">
      <span id="weekDay">星期六</span>
      <span class="week-num" id="weekNum">第30周</span>
    </div>
  </div>

  <div class="time-display" id="timeDisplay">
    <span id="timeMain">00:00:00</span><span class="ms" id="timeMs">.000</span>
  </div>

  <div class="tz-info">
    <span class="tz-label" data-i18n="bt.tzLabel">时区：</span>
    <span class="tz-value" id="tzValue">UTC+8</span>
    <span class="tz-deviation" id="tzDeviation">...</span>

<script src="lang.js?v=20260729"></script>
<script>
(function(){
  var dateLine=document.getElementById("dateLine");
  var weekDay=document.getElementById("weekDay");
  var weekNum=document.getElementById("weekNum");
  var timeMain=document.getElementById("timeMain");
  var timeMs=document.getElementById("timeMs");
  var tzValue=document.getElementById("tzValue");
  var tzDeviation=document.getElementById("tzDeviation");
  var fullscreenBtn=document.getElementById("fullscreenBtn");
  var card=document.getElementById("card");

  var showMs=false;
  var serverOffset=0; // 服务器时间 - 本地时间（毫秒）
  var synced=false;

  function weekdayKey(i){return ['bt.sun','bt.mon','bt.tue','bt.wed','bt.thu','bt.fri','bt.sat'][i];}

  // 从 time.syiban.com 获取服务器时间
  function fetchServerTime(){
    var url='http://time.syiban.com/get_bjtime_syhaomiao.php?q='+Date.now();
    var xhr=new XMLHttpRequest();
    xhr.open('GET',url,true);
    xhr.onreadystatechange=function(){
      if(xhr.readyState===4&&xhr.status===200){
        try{
          var raw=xhr.responseText;
          if(raw.indexOf('Newtime')===0)raw=raw.substring(7);
          var timeStr=atob(raw);
          // 格式: 2026-07-26 10:11:07.238
          var parts=timeStr.split(' ');
          var dateParts=parts[0].split('-');
          var timeParts=parts[1].split(':');
          var secMs=timeParts[2].split('.');
          var serverDate=new Date(
            parseInt(dateParts[0],10),
            parseInt(dateParts[1],10)-1,
            parseInt(dateParts[2],10),
            parseInt(timeParts[0],10),
            parseInt(timeParts[1],10),
            parseInt(secMs[0],10),
            parseInt(secMs[1],10)
          );
          serverOffset=serverDate.getTime()-Date.now();
          synced=true;
          updateSyncStatus();
        }catch(e){}
      }
    };
    xhr.send();
  }

  // 更新同步状态显示
  function updateSyncStatus(){
    if(synced){
      tzDeviation.textContent=I18N.t('bt.tzSynced');
      tzDeviation.classList.remove('warn');
    }
  }

  // 计算 ISO 8601 周数
  function getISOWeek(date){
    var d=new Date(Date.UTC(date.getUTCFullYear(),date.getUTCMonth(),date.getUTCDate()));
    var dayNum=d.getUTCDay()||7;
    d.setUTCDate(d.getUTCDate()+4-dayNum);
    var yearStart=new Date(Date.UTC(d.getUTCFullYear(),0,1));
    return Math.ceil((((d-yearStart)/86400000)+1)/7);
  }

  // 获取北京时间的 Date 对象（基于服务器时间 + 本地计时偏移）
  function getBeijingNow(){
    return new Date(Date.now()+serverOffset);
  }

  function getBeijingParts(){
    var now=getBeijingNow();
    var fmt=new Intl.DateTimeFormat("zh-CN",{
      timeZone:"Asia/Shanghai",
      year:"numeric",month:"numeric",day:"numeric",
      hour:"numeric",minute:"numeric",second:"numeric",
      hour12:false,
      weekday:"short"
    });
    var parts=fmt.formatToParts(now);
    var obj={};
    for(var i=0;i<parts.length;i++){
      obj[parts[i].type]=parts[i].value;
    }
    obj.ms=now.getMilliseconds();
    return obj;
  }

  function pad(n,len){
    len=len||2;
    var s=""+n;
    while(s.length<len)s="0"+s;
    return s;
  }

  // 更新显示
  function update(){
    var p=getBeijingParts();
    // 时间主显示 HH:MM:SS
    var h=pad(p.hour==="24"?"0":p.hour);
    var m=pad(p.minute);
    var s=pad(p.second);
    timeMain.textContent=h+":"+m+":"+s;
    timeMs.textContent="."+pad(p.ms,3);
    timeMs.style.display=showMs?"inline":"none";

    // 日期：2026年7月25日 / 2026/7/25
    dateLine.textContent=p.year+I18N.t('bt.year')+p.month+I18N.t('bt.month')+p.day+I18N.t('bt.day');
    // 星期
    // 用服务器校准后的北京时间求星期
    var bjDate=getBeijingNow();
    weekDay.textContent=I18N.t(weekdayKey(bjDate.getDay()));
    weekNum.textContent=I18N.t('bt.weekPrefix')+getISOWeek(bjDate)+I18N.t('bt.weekSuffix');
  }

  // 时区信息：显示用户本地时区
  function checkTimezone(){
    var now=new Date();
    var localOffset=-now.getTimezoneOffset();
    var tzStr=localOffset===8*60?I18N.t('bt.tzCST'):("UTC"+(localOffset>=0?"+":"")+(localOffset/60));
    tzValue.textContent=tzStr;
    // 同步状态在 fetchServerTime 成功后更新
    if(!synced){
      tzDeviation.textContent='...';
      tzDeviation.classList.remove('warn');
    }
  }

  // 全屏切换
  fullscreenBtn.addEventListener("click",function(){
    if(!document.fullscreenElement&&!document.webkitFullscreenElement){
      var req=card.requestFullscreen||card.webkitRequestFullscreen||card.msRequestFullscreen;
      if(req)req.call(card).catch(function(){});
      else{
        card.classList.add("fullscreen-mode");
        fullscreenBtn.textContent=I18N.t('common.exitFullscreen');
      }
    }else{
      if(document.exitFullscreen)document.exitFullscreen();
      else if(document.webkitExitFullscreen)document.webkitExitFullscreen();
    }
  });

  function onFsChange(){
    var fs=document.fullscreenElement||document.webkitFullscreenElement;
    if(fs){
      card.classList.add("fullscreen-mode");
      fullscreenBtn.textContent=I18N.t('common.exitFullscreen');
    }else{
      card.classList.remove("fullscreen-mode");
      fullscreenBtn.textContent=I18N.t('common.fullscreen');
    }
  }
  document.addEventListener("fullscreenchange",onFsChange);
  document.addEventListener("webkitfullscreenchange",onFsChange);

  // 全屏下点击时间退出全屏
  document.getElementById("timeDisplay").addEventListener("click",function(){
    if(card.classList.contains("fullscreen-mode")){
      if(document.fullscreenElement)document.exitFullscreen();
      else if(document.webkitFullscreenElement)document.webkitExitFullscreen();
      else card.classList.remove("fullscreen-mode");
      fullscreenBtn.textContent=I18N.t('common.fullscreen');
    }
  });

  // 语言切换时刷新动态文本（时区偏差、日期、星期、全屏按钮）
  window.addEventListener('langapply',function(){
    update();
    checkTimezone();
    updateSyncStatus();
    onFsChange();
  });

  // 初始化
  checkTimezone();
  update();
  // 首次同步服务器时间
  fetchServerTime();
  // 每 30 秒重新同步一次
  setInterval(fetchServerTime,30000);
  // 用 requestAnimationFrame 高频更新（约 60fps），毫秒数流畅滚动
  function loop(){
    update();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
