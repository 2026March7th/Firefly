<script>
function renderOSInfo(os,version,arch,bit){
  var html=os;
  if(version)html+="<br><span style='font-weight:500;font-size:0.92em;opacity:0.9'>"+I18N.t('hw.version')+version+"</span>";
  if(arch)html+="<br><span style='font-weight:500;font-size:0.88em;opacity:0.8'>"+I18N.t('hw.arch')+arch+(bit?" "+bit:"")+"</span>";
  document.getElementById("os-info").innerHTML=html;
}
function parseOSFromUA(ua,arch,bit){
  var os=I18N.t('common.unknown'),version="";
  var winMatch=ua.match(/Windows NT (\d+\.\d+)/);
  if(winMatch){
    var nt=winMatch[1];
    if(nt==="10.0"){os="Windows 10 / 11"}
    else if(nt==="6.3"){os="Windows 8.1"}
    else if(nt==="6.2"){os="Windows 8"}
    else if(nt==="6.1"){os="Windows 7"}
    else if(nt==="6.0"){os="Windows Vista"}
    else if(nt==="5.1"){os="Windows XP"}
    else{os="Windows"}
    version="NT "+nt;
  }
  else if(/iPad/.test(ua)){os="iPadOS";var m=ua.match(/OS (\d+[._]\d+(?:[._]\d+)?)/);if(m)version=m[1].replace(/_/g,".");}
  else if(/iPhone|iPod/.test(ua)){os="iOS";var m=ua.match(/OS (\d+[._]\d+(?:[._]\d+)?)/);if(m)version=m[1].replace(/_/g,".");}
  else if(/Mac OS X/.test(ua)){
    // iPadOS 13+ 的 UA 伪装成 Mac，通过触屏判断区分
    if(navigator.maxTouchPoints && navigator.maxTouchPoints>1){os="iPadOS"}
    else{os="macOS"}
    var m=ua.match(/Mac OS X (\d+[._]\d+(?:[._]\d+)?)/);
    if(m)version=m[1].replace(/_/g,".");
  }
  else if(/Android/.test(ua)){os="Android";var m=ua.match(/Android (\d+(?:\.\d+){0,2})/);if(m)version=m[1];}
  else if(/CrOS/.test(ua)){os="Chrome OS";var m=ua.match(/CrOS \S+ (\d+\.\d+\.\d+)/);if(m)version=m[1];}
  else if(/Linux/.test(ua)){os="Linux"}
  renderOSInfo(os,version,arch,bit);
}
function getOSInfo(){
  var ua=navigator.userAgent;
  var arch="",bit="";
  if(navigator.platform)arch=navigator.platform;
  // 优先使用现代 userAgentData API（Chromium 90+）获取高精度信息，可区分 Win10/11
  if(navigator.userAgentData && navigator.userAgentData.getHighEntropyValues){
    navigator.userAgentData.getHighEntropyValues(['platformVersion','architecture','bitness','model','fullVersionList'])
      .then(function(hv){
        var platform=navigator.userAgentData.platform;
        var os=I18N.t('common.unknown'),version="";
        if(platform==="Windows"){
          var pv=(hv.platformVersion||"").split('.');
          var major=parseInt(pv[0])||0;
          // 微软规则: major >= 13 = Windows 11; 1-12 = Windows 10; 0 = 旧版本
          if(major>=13){os="Windows 11"}
          else if(major>=1){os="Windows 10"}
          else{os=I18N.t('hw.windowsOld')}
          version=hv.platformVersion;
        } else if(platform==="macOS"){
          os="macOS";
          version=hv.platformVersion||"";
          // 仍需判断 iPadOS
          if(navigator.maxTouchPoints && navigator.maxTouchPoints>1){os="iPadOS"}
        } else if(platform==="Android"||/Android/.test(ua)){
          os="Android";
          version=hv.platformVersion||"";
        } else if(platform==="Chrome OS"||/CrOS/.test(ua)){
          os="Chrome OS";
          version=hv.platformVersion||"";
        } else if(platform){
          os=platform;
          version=hv.platformVersion||"";
        }
        if(hv.architecture && !arch)arch=hv.architecture;
        if(hv.bitness && !bit)bit=hv.bitness+I18N.t('hw.bit');
        renderOSInfo(os,version,arch,bit);
      })
      .catch(function(){parseOSFromUA(ua,arch,bit);});
    return;
  }
  parseOSFromUA(ua,arch,bit);
}
function getBrowserInfo(){
  var ua=navigator.userAgent;
  var browser=I18N.t('common.unknown'),version="";
  var m;
  if(/Edg\/(\d+)/.test(ua)){browser="Microsoft Edge";m=ua.match(/Edg\/(\d+)/)}
  else if(/OPR\/(\d+)/.test(ua)){browser="Opera";m=ua.match(/OPR\/(\d+)/)}
  else if(/Chrome\/(\d+)/.test(ua)&&!/Edg/.test(ua)){browser="Chrome";m=ua.match(/Chrome\/(\d+)/)}
  else if(/Firefox\/(\d+)/.test(ua)){browser="Firefox";m=ua.match(/Firefox\/(\d+)/)}
  else if(/Version\/(\d+).*Safari/.test(ua)){browser="Safari";m=ua.match(/Version\/(\d+)/)}
  if(m)version=m[1];
  document.getElementById("browser-info").textContent=version?browser+" "+version:browser;
}
function getScreenInfo(){
  var w=screen.width,h=screen.height;
  var dpr=window.devicePixelRatio||1;
  var depth=screen.colorDepth||screen.pixelDepth||24;
  var avail=I18N.t('hw.availArea')+screen.availWidth+" × "+screen.availHeight;
  document.getElementById("screen-info").innerHTML=I18N.t('hw.resolution')+w+" × "+h+"<br>"+I18N.t('hw.pixelRatio')+dpr+"x<br>"+I18N.t('hw.colorDepth')+depth+I18N.t('hw.bit')+"<br>"+avail;
}
function getHardwareInfo(){
  var cpu=navigator.hardwareConcurrency||I18N.t('common.unknown');
  var mem=navigator.deviceMemory?navigator.deviceMemory+"GB":I18N.t('common.unavailable');
  var lang=navigator.language||I18N.t('common.unknown');
  var touch=("ontouchstart" in window)?I18N.t('common.supported'):I18N.t('common.unsupported');
  var core=navigator.hardwareConcurrency?cpu+I18N.t('hw.cpuThreads'):I18N.t('common.unknown');
  document.getElementById("hardware-info").innerHTML=I18N.t('hw.cpu')+core+"<br>"+I18N.t('hw.memory')+mem+"<br>"+I18N.t('hw.language')+lang+"<br>"+I18N.t('hw.touch')+touch;
}
function detectAll(){
  getOSInfo();
  getBrowserInfo();
  getScreenInfo();
  getHardwareInfo();
}
window.addEventListener("load",detectAll);
window.addEventListener('langapply',detectAll);
